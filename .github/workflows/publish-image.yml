name: Publish stable image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# All versions of this package share one stable promotion lock.
concurrency:
  group: ghcr-maimemo-mcp-stable
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/huang-jiping/maimemo-mcp

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate exact version and master ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          commit="$(git rev-parse HEAD)"
          python scripts/validate_release.py preflight --tag "$RELEASE_TAG" --commit "$commit"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload digest without overwriting tags
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SOURCE_REVISION=${{ steps.release.outputs.commit }}
            IMAGE_VERSION=${{ steps.release.outputs.tag }}
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify immutable aliases and promote their digest to stable
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --digest "$RELEASE_DIGEST"
