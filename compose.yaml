name: maimemo

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - maimemo-app
  stop_grace_period: 30s

x-core-environment: &core-environment
  MAIMEMO_DATABASE_URL: ${MAIMEMO_DATABASE_URL:?Set the external PostgreSQL URL}
  MAIMEMO_TIMEZONE: ${MAIMEMO_TIMEZONE:-Asia/Shanghai}
  MAIMEMO_LOG_LEVEL: ${MAIMEMO_LOG_LEVEL:-INFO}

x-upstream-environment: &upstream-environment
  <<: *core-environment
  MAIMEMO_TOKEN_FILE: /run/secrets/maimemo_token
  MAIMEMO_TOKEN_FINGERPRINT_KEY_FILE: /run/secrets/token_fingerprint_key

x-upstream-secrets: &upstream-secrets
  - maimemo_token
  - token_fingerprint_key

services:
  migrate:
    <<: *runtime
    image: ${MAIMEMO_SERVER_IMAGE:-ghcr.io/huang-jiping/maimemo-server:0.2.0}
    restart: "no"
    entrypoint: ["maimemo-migrate"]
    environment:
      MAIMEMO_DATABASE_URL: ${MAIMEMO_DATABASE_URL:?Set the external PostgreSQL URL}

  server:
    <<: *runtime
    image: ${MAIMEMO_SERVER_IMAGE:-ghcr.io/huang-jiping/maimemo-server:0.2.0}
    environment:
      MAIMEMO_DATABASE_URL: ${MAIMEMO_DATABASE_URL:?Set the external PostgreSQL URL}
      MAIMEMO_SERVER_HOST: 0.0.0.0
      MAIMEMO_SERVER_PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp:
    <<: *runtime
    image: ${MAIMEMO_MCP_IMAGE:-ghcr.io/huang-jiping/maimemo-mcp:0.2.0}
    environment:
      <<: *upstream-environment
      MAIMEMO_MCP_HOST: 0.0.0.0
      MAIMEMO_MCP_PORT: 8000
      MAIMEMO_MCP_ALLOWED_HOSTS: mcp
      MAIMEMO_OPENAPI_DRIFT_STATE_FILE: /var/lib/maimemo/openapi-drift.json
    secrets: *upstream-secrets
    volumes:
      - type: bind
        source: ./var
        target: /var/lib/maimemo
        read_only: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    <<: *runtime
    image: ${MAIMEMO_WORKER_IMAGE:-ghcr.io/huang-jiping/maimemo-worker:0.2.0}
    environment:
      <<: *upstream-environment
      MAIMEMO_TODAY_INTERVAL_MINUTES: ${MAIMEMO_TODAY_INTERVAL_MINUTES:-30}
      MAIMEMO_RECORDS_INTERVAL_MINUTES: ${MAIMEMO_RECORDS_INTERVAL_MINUTES:-120}
    secrets: *upstream-secrets

networks:
  maimemo-app:
    driver: bridge
    internal: false

secrets:
  maimemo_token:
    file: ${MAIMEMO_TOKEN_SECRET_FILE:-./secrets/maimemo_token}
  token_fingerprint_key:
    file: ${MAIMEMO_TOKEN_FINGERPRINT_KEY_SECRET_FILE:-./secrets/token_fingerprint_key}
