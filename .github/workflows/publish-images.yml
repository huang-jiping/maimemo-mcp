name: Publish images

"on":
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: ghcr.io/huang-jiping/maimemo-server
          - target: mcp
            image: ghcr.io/huang-jiping/maimemo-mcp
          - target: worker
            image: ghcr.io/huang-jiping/maimemo-worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable and channel tags
        id: meta
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/maimemo/pyproject.toml | head -n 1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            version="${GITHUB_REF_NAME#v}"
            tags="${tags}"$'\n'"${IMAGE}:${version}"
          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "${tags}"
            echo 'EOF'
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: MAIMEMO_VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true
