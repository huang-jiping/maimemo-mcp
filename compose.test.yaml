name: maimemo-test
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: maimemo_test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: maimemo_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maimemo_test -d maimemo_test"]
      interval: 2s
      timeout: 3s
      retries: 30
