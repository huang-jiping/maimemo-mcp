[project]
name = "maimemo-workspace"
version = "0.2.0"
description = "Maimemo multi-package development workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "maimemo>=0.2.0,<0.3",
  "maimemo-mcp>=0.2.0,<0.3",
  "maimemo-server>=0.2.0,<0.3",
  "maimemo-worker>=0.2.0,<0.3",
  "alembic>=1,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1,<2",
  "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
maimemo = { workspace = true }
maimemo-mcp = { workspace = true }
maimemo-server = { workspace = true }
maimemo-worker = { workspace = true }
