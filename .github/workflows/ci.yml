name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.21'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Start disposable PostgreSQL
        run: docker compose -f compose.test.yaml up -d --wait
      - name: Build runtime image for container integration tests
        run: docker build --platform linux/amd64 -t maimemo-mcp:test .
      - name: Test
        run: uv run --frozen pytest -q
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker compose -f compose.test.yaml down --volumes
