[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maimemo-mcp"
version = "0.1.0"
description = "Read-only Maimemo learning data foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "psycopg[binary]>=3,<4",
  "alembic>=1,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.54,<1",
  "pyyaml>=6,<7",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1,<2",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maimemo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
