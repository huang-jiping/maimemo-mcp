name: Publish images

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ghcr-maimemo-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: ghcr.io/huang-jiping/maimemo-server
          - target: mcp
            image: ghcr.io/huang-jiping/maimemo-mcp
          - target: worker
            image: ghcr.io/huang-jiping/maimemo-worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.22"
          python-version: "3.12"

      - name: Validate version and master ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          uv run python scripts/validate_release.py preflight \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            MAIMEMO_VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Publish immutable aliases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python scripts/validate_release.py publish
          --image "${{ matrix.image }}"
          --tag "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
          --digest "${{ steps.build.outputs.digest }}"
