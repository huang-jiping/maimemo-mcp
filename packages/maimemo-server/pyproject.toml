[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maimemo-server"
version = "0.2.0"
description = "Maimemo HTTP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "maimemo>=0.2.0,<0.3",
  "alembic>=1,<2",
  "pydantic>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "starlette>=1,<2",
  "uvicorn>=0.54,<1",
]

[project.scripts]
maimemo-server = "maimemo_server.runtime:main"
maimemo-migrate = "maimemo_server.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maimemo_server"]
