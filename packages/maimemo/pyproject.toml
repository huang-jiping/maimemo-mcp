[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maimemo"
version = "0.2.0"
description = "Shared Maimemo learning data core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "psycopg[binary]>=3,<4",
  "httpx>=0.28,<1",
  "tzdata>=2025.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maimemo"]
